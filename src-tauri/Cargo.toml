[package]
name = "gitgui"
version = "0.26.0"
description = "A graph-first Git desktop client"
authors = ["GitGUI"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
default-run = "gitgui"

[[bin]]
name = "gitgui-mcp"
path = "src/bin/gitgui-mcp.rs"

[lib]
name = "gitgui_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"

# GTK (and its glib) is only used by the Linux webview.
[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[patch.crates-io]
glib = { path = "../vendor/glib" }

# Debug info for dependencies is the bulk of target/debug and is rarely needed.
[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
