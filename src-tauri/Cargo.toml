[package]
name = "gitgui"
version = "0.16.0"
description = "A graph-first Git desktop client"
authors = ["GitGUI"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "gitgui_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
glib = "0.18.5"

[patch.crates-io]
glib = { path = "../vendor/glib" }

# Debug info for dependencies is the bulk of target/debug and is rarely needed.
[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
