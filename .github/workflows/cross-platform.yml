# Tests GitGUI on Linux, macOS, and Windows, and adds macOS and Windows installers to each published release.
# Linux installers are still built on the maintainer's laptop (scripts/release.sh), which publishes the release.
name: Cross-platform
on:
  push:
    branches: [GitGUI]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF endings so tests that compare file contents behave the same everywhere.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --test
        working-directory: vscode-extension
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  installers:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.rust-targets }}" }
      - run: npm ci --ignore-scripts
      # On a release this uploads the installers to it; a manual run only builds them.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GitGUI-${{ runner.os }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe

  vscode-extension:
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    outputs:
      assets-uploaded: ${{ steps.upload.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm run package
        working-directory: vscode-extension
      - id: upload
        run: |
          gh release upload "$RELEASE_TAG" vscode-extension/*.vsix --clobber
          echo "done=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Publish to VS Code Marketplace when configured
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath ./*.vsix
          else
            echo "VSCE_PAT is not set; skipping VS Code Marketplace."
          fi
      - name: Publish to Open VSX when configured
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        working-directory: vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx publish ./*.vsix
          else
            echo "OVSX_PAT is not set; skipping Open VSX."
          fi

  checksums:
    # One writer after all asset uploads, including when marketplace publication fails.
    if: ${{ !cancelled() && github.event_name == 'release' && needs.installers.result == 'success' && needs.vscode-extension.outputs.assets-uploaded == 'true' }}
    needs: [installers, vscode-extension]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir assets
          gh release download "$RELEASE_TAG" --dir assets
          sh scripts/checksums.sh assets
          gh release upload "$RELEASE_TAG" assets/SHA256SUMS.txt --clobber
